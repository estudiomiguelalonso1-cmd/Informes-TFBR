name: Monthly Close

# Disparo manual: el usuario carga el export de Onvio en inputs/<period>/ y lo pushea
# ANTES de correr esto (ver README.md, "Flujo mensual"). No hay disparo automatico/por
# calendario a proposito - varios pasos del cierre dependen de datos que solo una persona
# puede dar cada mes (tipo de cambio, movimientos de patrimonio neto, etc).
on:
  workflow_dispatch:
    inputs:
      period:
        description: "Periodo a procesar, formato YYYY-MM (ej 2026-07)"
        required: true
      tc_cierre:
        description: "Tipo de cambio de cierre del periodo"
        required: true
      dif_cambio_mes:
        description: "Diferencia de cambio del mes para el cuadro de Balance Acumulado R$ (dejar vacio si no aplica / ya esta cargado)"
        required: false
        default: ""
      target_files:
        description: "IDs de layout separados por coma (vacio = todos). MVP: balance_mensual_ars"
        required: false
        default: "balance_mensual_ars"

jobs:
  run-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar LibreOffice + UNO bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc libreoffice-script-provider-python python3-uno

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Ubicar el modulo `uno` de LibreOffice
        # python3-uno se instala en el python del sistema (dist-packages), no en el venv de
        # setup-python. Lo agregamos al PYTHONPATH en vez de intentar pip-instalarlo.
        run: |
          UNO_PATH=$(python3 -c "import uno, os; print(os.path.dirname(uno.__file__))" 2>/dev/null || \
                     dirname "$(find /usr/lib/python3/dist-packages -name 'uno.py' | head -1)")
          echo "PYTHONPATH=$UNO_PATH:$PYTHONPATH" >> "$GITHUB_ENV"

      - name: Arrancar soffice headless
        run: |
          soffice --headless --invisible --nologo --nofirststartwizard --norestore \
                  "--accept=socket,host=localhost,port=2002;urp;" &
          # esperar a que levante el socket (ver macros/uno_pipeline.start_soffice para el
          # equivalente si se corre localmente en vez de en el workflow)
          for i in $(seq 1 30); do
            python3 -c "
import uno
ctx = uno.getComponentContext()
resolver = ctx.ServiceManager.createInstanceWithContext('com.sun.star.bridge.UnoUrlResolver', ctx)
resolver.resolve('uno:socket,host=localhost,port=2002;urp;StarOffice.ComponentContext')
" && break
            sleep 1
          done

      - name: Correr el pipeline
        run: |
          TARGETS_ARGS=""
          if [ -n "${{ github.event.inputs.target_files }}" ]; then
            IFS=',' read -ra IDS <<< "${{ github.event.inputs.target_files }}"
            for id in "${IDS[@]}"; do
              TARGETS_ARGS="$TARGETS_ARGS --target $id"
            done
          fi
          DIF_CAMBIO_ARG=""
          if [ -n "${{ github.event.inputs.dif_cambio_mes }}" ]; then
            DIF_CAMBIO_ARG="--dif-cambio-mes ${{ github.event.inputs.dif_cambio_mes }}"
          fi
          python -m src.pipeline \
            --period "${{ github.event.inputs.period }}" \
            --tc-cierre "${{ github.event.inputs.tc_cierre }}" \
            $DIF_CAMBIO_ARG \
            $TARGETS_ARGS
          echo "PIPELINE_EXIT=$?" >> "$GITHUB_ENV"

      - name: Publicar resumen en la pantalla del run
        if: always()
        run: cat "output/${{ github.event.inputs.period }}/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Subir los archivos generados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balances-${{ github.event.inputs.period }}
          path: output/${{ github.event.inputs.period }}/
          if-no-files-found: warn

      - name: Fallar el job si la validacion no paso
        if: env.PIPELINE_EXIT != '0'
        run: exit 1
